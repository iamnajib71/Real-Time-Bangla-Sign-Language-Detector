name: CPU tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: '-1'
      QT_QPA_PLATFORM: offscreen
      TF_NUM_INTEROP_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - run: python -m pytest -q --junitxml=reports/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-test-results
          path: reports/tests.xml
